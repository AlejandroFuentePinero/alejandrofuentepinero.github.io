# Site settings
locale                   : "en-US"
title                    : "Alejandro de la Fuente"
logo                     : "/images/groodle_favicon_256.png"
name                     : "Alejandro de la Fuente"
description              : "AI engineer building retrieval pipelines, agents and the evaluation that proves they work. Grounded in years of Bayesian wildlife forecasting with real consequences."
url                      : https://alejandrofuentepinero.github.io
baseurl                  : ""
repository               : "AlejandroFuentePinero/alejandrofuentepinero.github.io"
# The design system is self-contained in _sass/ and assets/css/site.scss.
# Without an explicit null, the github-pages gem injects jekyll-theme-primer
# and ships 76 KB of dead CSS at /assets/css/style.css.
theme                    : null
og_image                 :          # real 1200x630 asset arrives in Phase 6

# Site author. Consumed by the header brand, the footer contact links and
# the contact page.
author:
  name             : "Alejandro de la Fuente"
  location         : "Melbourne, Australia"
  email            : "alejandrofuentepinero@gmail.com"
  googlescholar    : "https://scholar.google.com.au/citations?user=7CKVdZwAAAAJ&hl=en"
  github           : "AlejandroFuentePinero"
  linkedin         : "alejandro-dela-fuente/"
  orcid            : "https://orcid.org/0000-0001-9686-3844"

# Reading files
include:
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - REFURB_BRIEF.md
  - AUDIT.md
  - POSITIONING.md
  - CONTENT_MAP.md
  - DECISIONS.md
  - MIGRATIONS.md
  - FINDINGS.md
  - CLAUDE.md
  - docs
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - config
  - gulpfile.js
  - log
  - node_modules
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: false
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  projects:
    output: true
    permalink: /projects/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
  - scope:
      path: ""
      type: projects
    values:
      layout: project

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Australia/Brisbane

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

---
layout: default
---
<article class="prose-column page-block">
  <header class="page-header">
    <p class="page-header__meta"><span class="label">{{ page.type | default: "Talk" }}</span><span class="label">{{ page.date | date: "%Y" }}</span></p>
    <h1>{{ page.title }}{% if page.award %} <span class="tag-award">{{ page.award }}</span>{% endif %}</h1>
    <p class="page-header__venue">{{ page.venue }} &middot; {{ page.location }}</p>
  </header>
  {{ content }}
</article>

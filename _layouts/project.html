---
layout: default
---
<article class="prose-column page-block">
  <header class="page-header">
    <p class="page-header__meta"><span class="label">{{ page.type | capitalize }}</span><span class="label">{{ page.date | date: "%Y" }}</span></p>
    <h1>{{ page.title }}</h1>
    {% if page.stack %}
    <p class="card__chips">
      {% for chip in page.stack %}<span class="chip">{{ chip }}</span>{% endfor %}
    </p>
    {% endif %}
  </header>
  {{ content }}
</article>

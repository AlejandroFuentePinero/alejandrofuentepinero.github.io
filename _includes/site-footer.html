{% comment %}
  Component 13: footer. Contact links appear here once, per brief 5.3.
{% endcomment %}
<footer class="site-footer">
  <div class="container site-footer__inner">
    <p class="site-footer__name">{{ site.author.name }}</p>
    <ul class="site-footer__links">
      <li><a href="mailto:{{ site.author.email }}">Email</a></li>
      <li><a href="https://www.linkedin.com/in/{{ site.author.linkedin }}" rel="noopener">LinkedIn</a></li>
      <li><a href="https://github.com/{{ site.author.github }}" rel="noopener">GitHub</a></li>
      <li><a href="{{ site.author.googlescholar }}" rel="noopener">Scholar</a></li>
      <li><a href="{{ site.author.orcid }}" rel="noopener">ORCID</a></li>
    </ul>
  </div>
  <div class="container">
    <p class="site-footer__fine">{{ site.author.location }} &middot; <a href="{{ '/terms/' | relative_url }}">Terms</a></p>
  </div>
</footer>

<script>
  /* Blocking on purpose: the stored theme must land on <html> before first
     paint so a hard reload never flashes the wrong theme. With no stored
     choice, the prefers-color-scheme rules in the stylesheet decide. */
  (function () {
    try {
      var theme = localStorage.getItem("theme");
      if (theme === "dark" || theme === "light") {
        document.documentElement.setAttribute("data-theme", theme);
      }
    } catch (e) {}
  })();
</script>

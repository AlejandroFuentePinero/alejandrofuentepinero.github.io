# _data/apps.yml
# status: live | archived        (drives the stats band count)
# treatment: embed | link | archive   (drives the /apps/ card rendering)
- id: digital-twin
  name: "Digital twin"
  status: live
  treatment: embed
  url: /digital-twin/
  source: "https://github.com/AlejandroFuentePinero/digital-twin"
  project: /projects/digital-twin/
  pitch: "A conversational agent answers questions about my work, grounded in a curated knowledge base. A second model reviews every answer before a visitor sees it."
  demonstrates: "It shows evaluation discipline applied to an agent: a frozen baseline scores retrieval and answer quality."
  note: ""
  screenshot: /images/apps/digital-twin.png
  screenshot_width: 1232
  screenshot_height: 954

- id: 7ph-graph
  name: "7PH Graph"
  status: live
  treatment: link
  url: "https://7phgraph.com"
  source: "https://github.com/AlejandroFuentePinero/7ph-graph"
  project: /projects/7ph-graph/
  pitch: "A live knowledge graph of a competitive Magic format: 107 events, 4,591 decks. Every chart carries provenance and statistical guards."
  demonstrates: "It shows graph modelling and a build that refuses to draw charts the evidence cannot support."
  note: "First load can take about 10 seconds."
  screenshot: /images/apps/7ph-graph.png
  screenshot_width: 1280
  screenshot_height: 800

- id: job-intelligence-engine
  name: "Job Intelligence Engine"
  status: live
  treatment: link
  url: "https://job-intelligence-engine.streamlit.app"
  source: "https://github.com/AlejandroFuentePinero/job-intelligence-engine"
  project: /projects/job-intelligence-engine/
  pitch: "An extraction pipeline turns 6,100 job postings into ranked role recommendations. A judge model scores the extraction layer's accuracy."
  demonstrates: "It shows a deterministic pipeline where every model reports its score on held-out data."
  note: ""
  screenshot: /images/apps/job-intelligence-engine.png
  screenshot_width: 1280
  screenshot_height: 800

- id: birds-shiny
  name: "Bird population trends"
  status: live
  treatment: link
  url: "https://alejandrodelafuente.shinyapps.io/BirdsPopTrendAWT/"
  source: ""
  project: /projects/heightened-protection-bird-trends/
  pitch: "An explorer for population trends of rainforest birds in the Australian Wet Tropics, built from 17 years of standardised monitoring."
  demonstrates: "It shows research made usable: the models behind a published paper, open for anyone to query."
  note: "Free hosting, wakes in about 20 seconds."
